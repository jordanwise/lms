    Properties:
      Handler: tick.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LMSTable
      Events:
        ScheduledTick:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: LMSTickSchedule
            Description: Periodic tick to process locked rounds
            Enabled: true
      CodeUri: TickFunction
    Metadata:
      BuildMethod: esbuild
