AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Last Player Standing - Game Backend
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Architectures:
    - x86_64
    Environment:
      Variables:
        TABLE_NAME:
          Ref: LMSTable
        DYNAMODB_ENDPOINT: ''
Resources:
  LMSTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LMS
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      - AttributeName: GSI1PK
        AttributeType: S
      - AttributeName: GSI2PK
        AttributeType: S
      - AttributeName: GSI2SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: GSI1
        KeySchema:
        - AttributeName: GSI1PK
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      - IndexName: GSI2
        KeySchema:
        - AttributeName: GSI2PK
          KeyType: HASH
        - AttributeName: GSI2SK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: createUser.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LMSTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /users
            Method: post
      CodeUri: CreateUserFunction
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/createUser.ts
        Minify: true
        Target: es2020
      SamResourceId: CreateUserFunction
  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getUser.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LMSTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /users/{userId}
            Method: get
      CodeUri: GetUserFunction
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handlers/getUser.ts
        Minify: true
        Target: es2020
      SamResourceId: GetUserFunction
  UpdatePreferencesFunction:
