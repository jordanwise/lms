<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Player Standing - Join Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F0F1A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 400px;
      width: 100%;
    }
    .logo {
      font-size: 32px;
      font-weight: 700;
      color: #6C63FF;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 16px;
      color: #9E9EB8;
      margin-bottom: 32px;
    }
    .pin-card {
      background: #1A1A2E;
      border-radius: 16px;
      padding: 32px 24px;
      margin-bottom: 32px;
    }
    .pin-label {
      font-size: 14px;
      color: #9E9EB8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .pin {
      font-size: 36px;
      font-weight: 700;
      color: #6C63FF;
      letter-spacing: 6px;
      font-family: monospace;
    }
    .info {
      font-size: 14px;
      color: #6B6B80;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
    }
    .btn-primary {
      background: #6C63FF;
      color: #FFFFFF;
    }
    .btn-secondary {
      background: #1A1A2E;
      color: #FFFFFF;
      border: 1px solid #2A2A40;
    }
    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: #6B6B80;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">&#x26BD; Last Player Standing</div>
    <div class="subtitle">Fantasy football, last one standing wins</div>

    <div class="pin-card">
      <div class="pin-label">Game PIN</div>
      <div class="pin" id="pin">--------</div>
    </div>

    <div class="info">
      Open the Last Player Standing app and enter this PIN on the
      <strong>Join Game</strong> screen, or tap the button below.
    </div>

    <div class="buttons">
      <a class="btn btn-primary" id="appLink" href="#">Open in App</a>
      <a class="btn btn-secondary" href="https://apps.apple.com/app/last-player-standing/id0000000000">Download on the App Store</a>
      <a class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.manning.lastplayerstanding">Get it on Google Play</a>
    </div>

    <div class="footer">
      &copy; 2025 Last Player Standing
    </div>
  </div>

  <script>
    // Extract PIN from URL: /join/PIN or ?pin=PIN
    const url = new URL(window.location.href);
    let pin = '';

    // Try path-based: /join/PIN
    const pathParts = url.pathname.split('/').filter(Boolean);
    if (pathParts.length >= 2 && pathParts[0] === 'join') {
      pin = pathParts[1].toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    }

    // Try query param: ?pin=PIN
    if (!pin) {
      pin = (url.searchParams.get('pin') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    }

    if (pin) {
      document.getElementById('pin').textContent = pin;
      document.getElementById('appLink').href = 'lms://join/' + pin;
    } else {
      document.getElementById('pin').textContent = '--------';
      document.getElementById('appLink').href = 'lms://';
      document.getElementById('appLink').textContent = 'Open App';
    }
  </script>
</body>
</html>
